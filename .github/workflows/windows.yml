name: Windows

# Builds libmojave on Windows (MinGW and MSVC, via setup-ocaml) with dune, in both
# thread profiles. This is the only place the Win32 branches of cutil/ and
# the OCaml sources are compiled. It runs the pinning tests: six share their
# expected output with Unix, and the filename and glob tests, whose output is
# separator- and drive-dependent by design, compare against *.win32.expected.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dune:
    name: build on Windows (OCaml ${{ matrix.ocaml }}, ${{ matrix.compiler }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["5.4"]
        compiler: [mingw, msvc]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          windows-compiler: ${{ matrix.compiler }}
      - run: opam install -y dune dune-configurator
      - name: build (null threads)
        run: opam exec -- dune build
      - name: build (system threads)
        run: opam exec -- dune build --profile threads
      - name: pinning tests (filename and glob use test/*.win32.expected)
        run: opam exec -- dune runtest
      - name: the dune archives hold exactly the listed modules
        shell: bash
        run: |
          for d in stdlib system util unix; do
            sed -n 's/^ *\(lm_[a-z0-9_]*\) *$/\1/p' "$d/Files" | tr -d '\r'
          done | sort > listed.txt
          test -s listed.txt || { echo "FAIL: no modules listed"; exit 1; }
          for a in _build/default/lib/lm.cma _build/default/lib/lm.cmxa; do
            test -f "$a" || { echo "FAIL: $a was not built"; exit 1; }
            opam exec -- ocamlobjinfo "$a" | tr -d '\r' | sed -n -e 's/^Unit name: *//p' -e 's/^Name: *//p' \
              | tr 'A-Z' 'a-z' | sort > units.txt
            if ! diff -u listed.txt units.txt; then
              echo "FAIL: $a does not match the Files lists"; exit 1
            fi
            echo "OK $a: $(wc -l < units.txt) modules"
          done
